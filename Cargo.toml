[workspace]
resolver = "2"
members = [
  "crates/qa-attr", "crates/qa-model", "crates/qa-policy", "crates/qa-syntax",
  "crates/qa-rules", "crates/qa-engine", "crates/qa-backends", "crates/qa-report",
  "crates/qa-sdk", "crates/qa-testkit", "crates/qa-alloc-runtime", "crates/qa-fault-runtime",
  "crates/cargo-qa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.8.23"
thiserror = "=2.0.17"
walkdir = "=2.5.0"
quote = "=1.0.45"
syn = { version = "=2.0.117", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
crossterm = "=0.29.0"

[profile.release]
overflow-checks = true
