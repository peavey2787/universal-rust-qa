schema=1
profile="strict"
output_dir="qa-out"
[summary.health_weights]
structure=35
tests=25
duplication=15
dead_code=15
findings=10
[metrics]
file_loc=400
function_loc=50
cyclomatic=12
cognitive=15
crap=15.0
coverage_percent=90.0
duplicate_percent=5.0
dead_code_percent=2.0
[sprawl]
function_statements=25
parameters=5
generic_parameters=4
struct_fields_warn=12
struct_fields_deny=24
enum_variants_warn=16
module_depth_warn=4
module_depth_deny=6
impl_methods_warn=25
trait_methods_warn=15
[duplicates]
minimum_nodes=15
minimum_loc=8
near_clone_similarity=0.90
[dead_code]
closed_world=false
exported_unreferenced="warn"
[architecture]
[tests]
require_production_reachability=true
reject_tautological_assertions=true
reject_unseeded_randomness=true
reject_anonymous_ignore=true
[coverage]
mode="auto"
all_features=false
include_packages=[]
exclude_packages=[]
features=[]
no_default_features=false
targets=[]
adaptive=true
[mutation]
mode="existing"
minimum_kill_percent=90.0
timeout_seconds=120
[fuzz]
build_targets=false
require_critical_parser_target=true
reject_vacuous_targets=true
[safety]
unwrap="deny"
expect="deny"
panic="deny"
indexing="deny"
require_safety_comment=true
critical_checked_arithmetic=true
[resources]
unbounded_channels="deny"
untrusted_allocation="deny"
unbounded_accumulation="deny"
[alloc]
explicit_leaks="deny"
hot_path_allocation="warn"
[environment]
detect_absolute_host_paths=true
detect_undeclared_env=true
allow_vars=["PATH","RUST_BACKTRACE","CARGO_MANIFEST_DIR","OUT_DIR"]
[state]
enabled=true
require_explicit_invalid_transition=true
require_roundtrip_contract=true
reject_terminal_exit=true
require_restart_contract=true
[async_rules]
enabled=true
blocking_calls="deny"
detached_tasks="deny"
await_holding_lock="deny"
critical_requires_cancellation_contract=true
relaxed_atomics="warn"
static_mut="deny"
[concurrency]
loom_enabled=false
loom_feature="loom"
[errors]
discarded_results="deny"
secret_logging="deny"
broken_sources="deny"
lost_context="warn"
[secrets]
deny_debug_display=true
require_zeroize=true
[constant_time]
enabled=true
secret_branch="deny"
secret_index="deny"
mode="explicit"
[sanitizers]
mode="explicit"
kinds=["address","leak","thread","memory"]
toolchain="nightly"
msan_complete_instrumentation=true
[differential]
enabled=false
seed=1
[fault]
enabled=false
seed=1
run_tests=false
max_fail_points=16
kinds=["io","allocation","partial_io","latency","clock"]
feature="qa-fault-injection"
[mir]
mode="explicit"
toolchain="nightly"
check_panic_edges=true
check_no_alloc=true
check_zeroization=true
check_drop_cleanup=true
check_async_retention=true
[platform]
check_default=true
check_no_default=true
check_all_features=true
check_msrv=true
check_each_feature=false
targets=[]
[build]
deny_network=true
writes_outside_out_dir="deny"
process_spawn="warn"
require_rerun_directives=true
[layout]
critical_requires_repr=true
deny_raw_padded_byte_casts=true
deny_packed_references=true
[ffi]
require_safety_docs=true
deny_panic_across_boundary=true
[viewer]
command="code"
args=["--goto","{path}:{line}"]
[exceptions]
require_reason=true
require_expiry=true
max_days=365

[[exception]]
rule="QA-SAFE-003"
path="crates/qa-testkit/**"
reason="Assertion-oriented QA test helpers intentionally panic when the tested invariant fails."
expires="2027-08-22"

[hardware]
enabled=false
interrupt_stack_budget_bytes=2048
deny_heap_in_interrupts=true
deny_blocking_in_interrupts=true
deny_panic_in_interrupts=true

[performance]
enabled=false
false_sharing="warn"
vectorization_contract="deny"
instruction_warn_percent=10.0
instruction_deny_percent=25.0
baseline_path="qa/performance-baseline.json"

[bloat]
max_percent_growth=5.0
max_absolute_growth_bytes=262144
baseline_path="qa/bloat-baseline.json"

[hardening]
enabled=true
release_overflow_checks=true
deny_executable_stack=true
deny_rwx_segments=true
deny_host_paths=true
require_pie=true
require_full_relro=true

[snapshots]
ci_updates="deny"
pending="deny"
unreferenced="deny"
secret_scan=true
unstable_content="warn"

[documentation]
critical_missing_docs="deny"
critical_requires_example=true
run_doctests=true
check_examples=true

[dependencies]
run_cargo_deny=true
run_unused=true
deny_wildcards=true
deny_git_dependencies=false

[api]
run_semver_checks=false
unsafe_requires_safety_docs=true
public_missing_docs="warn"
must_use_results="warn"

[generated]
verify=true

[reproducibility]
enabled=true
runs=2
release=true
locked=true
artifacts=[]

[self_hardening]
enabled=true
require_clean_tree=true
require_rule_registry_integrity=true
require_report_schema=true
max_source_file_loc=600
